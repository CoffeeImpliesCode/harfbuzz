# Verification for the Zig package in this repository.
#
# This file is entirely this fork's. Upstream ships CI of its own, and it is not
# something this fork retargets: upstream's `README.upstream.md:7-13` - the
# preserved copy of upstream's own README, byte for byte - carries its badges,
# one for `.github/workflows/linux.yml`, one for `macos.yml`, one for `msvc.yml`
# and one for an OSS-Fuzz project. Those workflows configure meson on another
# maintainer's accounts and describe another maintainer's release process.
# Copying them here would be claiming their infrastructure, and adapting them
# would be building a project upstream does not ship. So this file gates the
# artifacts this fork delivers.
#
# Four jobs, four different questions:
#   native     does the single C++ translation unit compile against the sibling
#              FreeType, link and install, do the behavioural tests run in both
#              optimize modes, does the example run, and does the six-target
#              compile check close
#   cross      does the whole package compile for each of the six baseline check
#              targets, one step per target, running nothing
#   consumer   does the published module resolve from a package that did not
#              write it, and does its program run
#   provenance do the recorded upstream digests, the exact vendored file set and
#              the licence records still agree with this tree, with no compiler
#              involved
#
# There is no `continue-on-error` in this file and there is no matrix with a
# tolerated target. Each target is a separate step on purpose: a matrix row
# allowed to fail is indistinguishable from a target that was quietly dropped,
# and "we know that one is broken" is only a fact once a gate run has printed
# the failure. Today there is no such row to assert: `refused_check_targets` in
# `build.zig` is empty, `Platform.forTarget` refuses nothing, and
# `checkMatrixPartition` stops the two lists from disagreeing -- so all six
# baseline rows are compiled here and none is dropped silently.
#
# The six steps below ask for the default static delivery, and a green run of
# this file is evidence about the static delivery only. It is not evidence about
# `libharfbuzz.so.0.61451.61451`, and this file does not pretend otherwise: it
# walks no shared-object configuration, and the shared delivery is exercised on
# the host instead, by the `sdk:build:shared` devenv task and by
# `zig build consumer -Dlinkage=dynamic`.
#
# System-library mode (`-fsys=harfbuzz` / `-Dsystem=true`) is deliberately not a
# step here: it needs an installed HarfBuzz with its own headers, and a stock
# runner has none. It is gated locally on a machine that has it, and a claim
# about it needs that run, not this file. That the mode exists at all is
# `SOURCE-CONFIRMED` from `build.zig`; that it works is NOT RUN until someone
# runs it.
#
# The full 53-platform matrix is not in this file. `cross-test`, run from the
# package root, builds and *runs* `tests.zig` for every platform in Zig 0.16.0's
# published Tier 1/2 table through this repository's own build graph, using
# `cross-test.profile.sh` for its settings. It is not a job here because
# `cross-test` and its sibling helpers are a host-local tool with its own runner
# detection and its own scratch policy, not something a GitHub runner has;
# adding a job that invoked a path it does not have would fail for a reason that
# has nothing to do with this package, and wrapping that job in an availability
# check would turn a missing gate into a green one. So this file does not pretend
# to cover it: the `cross` job runs nothing, and a platform with no runner on the
# host is recorded as explicit `build_only` coverage, never as a pass.
#
# One precondition is asserted rather than assumed, and it applies to every job
# that builds this package: the sibling FreeType checkout has to be beside it.
# `build.zig.zon` declares FreeType as a relative path, because `src/harfbuzz.cc`
# includes `hb-ft.cc` unconditionally and that file needs FreeType's headers and
# its code. A runner cannot fetch it -- the upstream release is not published
# anywhere this workflow could reach -- so each job checks for the sibling and
# fails with that reason instead of reporting a package that never linked it.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: native build, tests, example and six-target compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: sibling FreeType checkout
        run: |
          if [ ! -f ../freetype/build.zig.zon ]; then
            echo "the sibling FreeType source tree is not beside this checkout." >&2
            echo "This package compiles src/hb-ft.cc against it and links its archive;" >&2
            echo "place the sibling at ../freetype, or pass -Dfreetype=<path>." >&2
            exit 1
          fi
          echo "freetype sibling: $(realpath ../freetype)"

      # `LC_ALL=C` is not cosmetic. Upstream's own shaping-test runner sets it
      # (test/shape/run-tests.py:19) because hb_language_get_default() reads the
      # locale, and the recorded expectations this package compares against were
      # taken under "C".
      - name: build and install
        run: zig build --summary all
        env:
          LC_ALL: C

      # Two optimize modes, and the second is not a formality: the same tests
      # over a different compilation of the same translation unit.
      - name: test (Debug)
        run: zig build test --summary all
        env:
          LC_ALL: C

      - name: test (ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe --summary all
        env:
          LC_ALL: C

      - name: smoke
        run: zig build smoke --summary all
        env:
          LC_ALL: C

      # Six targets compiled, nothing run. `check` uses addTest for each target
      # so the facade's declarations are instantiated rather than left as an
      # unreferenced archive.
      - name: check
        run: zig build check --summary all

  cross:
    name: cross-target compile matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: sibling FreeType checkout
        run: |
          if [ ! -f ../freetype/build.zig.zon ]; then
            echo "the sibling FreeType source tree is not beside this checkout." >&2
            exit 1
          fi

      # Six separate compile steps, six separate targets, no tolerated failure.
      # Each one compiles the whole package for that target: the single C++
      # translation unit with that target's own platform macros, the sibling
      # FreeType's, the translated `hb.h` / `hb-ft.h`, the facade, the tests and
      # the example. Nothing is run, so a green step is compile evidence and not a
      # claim that a foreign binary executed.
      - name: check x86_64-linux-gnu
        run: zig build check -Dtarget=x86_64-linux-gnu --summary all

      - name: check aarch64-linux-gnu
        run: zig build check -Dtarget=aarch64-linux-gnu --summary all

      - name: check aarch64-macos-none
        run: zig build check -Dtarget=aarch64-macos-none --summary all

      # The Windows row is the one that turns the pthread macros off and the
      # blob loader's mmap path off: `Platform.forTarget` in build.zig resolves
      # both from the target being built, so this cell compiles a different
      # preprocessor world from the Linux cells above rather than the same one
      # twice.
      - name: check x86_64-windows-gnu
        run: zig build check -Dtarget=x86_64-windows-gnu --summary all

      - name: check riscv64-linux-gnu
        run: zig build check -Dtarget=riscv64-linux-gnu --summary all

      # The sixth row, compiled like the others. HarfBuzz is guarded at every
      # optional dependency by an `HAVE_*` test and reaches nothing outside its
      # own headers on this target, so `refused_check_targets` is empty and this
      # row asserts nothing about running: a foreign target runs only if the host
      # has an executor for it.
      - name: check wasm32-wasi
        run: zig build check -Dtarget=wasm32-wasi --summary all

  consumer:
    name: consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: sibling FreeType checkout
        run: |
          if [ ! -f ../freetype/build.zig.zon ]; then
            echo "the sibling FreeType source tree is not beside this checkout." >&2
            exit 1
          fi

      # The failure this catches is the one the library's own tests cannot see:
      # a module that builds from the inside and does not resolve from outside.
      # `build.zig`'s consumer step runs the separate `consumer/` package as its
      # own `zig build`, forwarding this build's resolved target, optimize mode,
      # linkage, dispatch shape and FreeType path rather than the defaults it
      # would pick for itself, so the program it runs is a consumer of the
      # configuration this tree was built in.
      - name: run
        run: zig build consumer --summary all
        env:
          LC_ALL: C

  provenance:
    name: upstream digests, file set and licence records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Zig toolchain is installed for this job, and that is the point: the
      # questions the checker answers -- do the 932 vendored files still hash to
      # what UPSTREAM.sha256 records, is the vendored file set exactly that set,
      # is the manifest upstream-only, do the two digest records agree, are all
      # three COPYING files still where the records say, and are the four oracle
      # fixtures covered -- need sha256sum, grep, find, awk, diff and comm and
      # nothing else. A provenance gate that needed the compiler would not
      # survive the compiler being broken.
      - name: provenance
        run: tools/check-provenance.sh